<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LITELAB — How to Light a 9,000 Sq.Ft Oceanfront Villa — Azure The Oceanic, Chennai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --litelab-gold: #D4AF37;
      --obsidian: #0F1114;
      --slate: #94A3B8;
      --card-bg: #16191E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--obsidian);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 28px 16px 48px;
    }
    .header-bar {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--slate);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .header-bar span {
      color: var(--litelab-gold);
      font-weight: 700;
    }
    .deck-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .slide-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 1350;
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <span>LITELAB LIGHTING STUDIO</span> · AzureOceanic
  </div>
  <div class="deck-container">
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_01.png" alt="Slide 01"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_02.png" alt="Slide 02"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_03.png" alt="Slide 03"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_04.png" alt="Slide 04"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_05.png" alt="Slide 05"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_06.png" alt="Slide 06"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_07.png" alt="Slide 07"></div>
    <div class="slide-card"><img class="slide-img" src="../instagram/AzureOceanic_IG_08.png" alt="Slide 08"></div>
  </div>
</body>
</html>
