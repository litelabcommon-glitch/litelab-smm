name: "✨ LITELAB Social Media & Zoho Social Autopilot"

on:
  schedule:
    # Fire daily at 13:00 UTC (06:30 PM IST)
    - cron: "0 13 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (generates Zoho Social CSV without live API posting)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  publish:
    name: "📡 Publish & Schedule LITELAB Content"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ── Zoho Social ──
      ZOHO_REGION: ${{ secrets.ZOHO_REGION || 'in' }}
      ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      ZOHO_SOCIAL_BRAND_ID: ${{ secrets.ZOHO_SOCIAL_BRAND_ID }}
      ZOHO_SOCIAL_PORTAL_ID: ${{ secrets.ZOHO_SOCIAL_PORTAL_ID }}

      # ── Google Sheets ──
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      # ── Gemini AI ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── LinkedIn ──
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}

      # ── YouTube ──
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      # ── Instagram ──
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_MODE: ${{ secrets.INSTAGRAM_MODE }}
      BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}

      # ── Notifications ──
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ── Runtime ──
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      LOG_LEVEL: "INFO"

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📥 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🚀 Run LITELAB SMM Engine"
        run: python -m src.main

      - name: "📋 Upload Zoho Social Schedule CSV & Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litelab-smm-run-${{ github.run_id }}
          path: |
            *.log
            posts/**/zoho_social_schedule.csv
            posts/zoho_social_master_queue.csv
          retention-days: 14
          if-no-files-found: ignore
